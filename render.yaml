# Blueprint de deploy no Render: API (Docker) + PostgreSQL gerenciado.
#
# Como usar:
#   1. Crie a conta em render.com e conecte o repositorio do GitHub
#   2. New > Blueprint > selecione este repositorio
#   3. O Render le este arquivo, cria o banco e o servico web
#   4. Depois do primeiro deploy, copie a URL da API e configure o frontend
#
# O frontend (Vercel) precisa de VITE_API_URL apontando para a URL da API abaixo,
# e a API precisa de CORS_ALLOWED_ORIGINS com o dominio do frontend.

databases:
  - name: eventhub-db
    databaseName: eventhub
    user: eventhub
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: eventhub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Componentes do JDBC montados em application.yml (DB_HOST/DB_PORT/DB_NAME).
      - key: DB_HOST
        fromDatabase:
          name: eventhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: eventhub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: eventhub-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: eventhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: eventhub-db
          property: password

      # Gerado pelo Render; trocar rotaciona todas as sessoes.
      - key: JWT_SECRET
        generateValue: true

      # Ajuste para o dominio real do frontend depois do deploy da Vercel.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
