# Blueprint de deploy no Render: apenas a API.
#
# O banco NAO fica no Render: o PostgreSQL gratuito expira em ~30 dias e o pago
# exige cartao. Use Neon (gratuito, sem cartao) e preencha DB_* no painel.
# Guia completo: docs/deploy.md
#
# Como usar:
#   1. Crie o banco no Neon e copie host, usuario, senha e database
#   2. Crie a conta no render.com e conecte o repositorio do GitHub
#   3. New > Blueprint > selecione este repositorio
#   4. Preencha DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD quando o Render pedir
#   5. Depois do deploy, ajuste CORS_ALLOWED_ORIGINS com o dominio da Vercel

services:
  - type: web
    name: eventhub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # sync: false = o Render pergunta o valor no painel, nao fica no repositorio.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Neon e Supabase exigem TLS; o driver aceita a query string no final da URL.
      - key: DB_PARAMS
        value: "?sslmode=require"

      # Gerado pelo Render; trocar rotaciona todas as sessoes.
      - key: JWT_SECRET
        generateValue: true

      # Ajuste para o dominio real do frontend depois do deploy da Vercel.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
