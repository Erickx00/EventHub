name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: eventhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventhub -d eventhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Liga o SchemaIT: sem isso o teste de schema e pulado.
      IT_POSTGRES: 'true'
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eventhub
      SPRING_DATASOURCE_USERNAME: eventhub
      SPRING_DATASOURCE_PASSWORD: eventhub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes unitarios e de schema
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
