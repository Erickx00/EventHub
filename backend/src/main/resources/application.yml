spring:
  application:
    name: eventhub

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventhub}
    username: ${DB_USER:eventhub}
    password: ${DB_PASSWORD:eventhub}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # O schema e propriedade do Flyway. Hibernate apenas valida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

eventhub:
  security:
    jwt:
      # HS256 exige >= 32 bytes. Em producao SEMPRE defina JWT_SECRET.
      secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${REFRESH_TOKEN_TTL:P7D}
  orders:
    # Janela para pagar um pedido PENDING antes de expirar e devolver o estoque.
    payment-ttl: ${ORDER_PAYMENT_TTL:PT15M}
    expiry-scan-ms: ${ORDER_EXPIRY_SCAN_MS:60000}
  events:
    # Fecha eventos cujo fim ja passou (saem da busca publica).
    finish-scan-ms: ${EVENT_FINISH_SCAN_MS:300000}

logging:
  level:
    com.eventhub: INFO
    org.hibernate.SQL: WARN
